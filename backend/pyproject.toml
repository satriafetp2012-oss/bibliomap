[project]
name = "bibliomap"
version = "0.1.0"
description = "Bibliometric analysis and science mapping platform"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "leidenalg>=0.10",
    "numpy>=2.1",
    "openpyxl>=3.1",
    "pydantic>=2.9",
    "python-igraph>=0.11",
    "python-multipart>=0.0.12",
    "rapidfuzz>=3.10",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.24",
    "httpx2>=2.16.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-openpyxl>=3.1.5.20261017",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bibliomap"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# igraph and leidenalg ship no type information.
[[tool.mypy.overrides]]
module = ["igraph.*", "leidenalg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
